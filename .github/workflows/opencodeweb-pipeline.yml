# =====================================================================
# OpenCodeWEB OS â€” Self-Healing CI/CD Pipeline (Master Monorepo)
# ---------------------------------------------------------------------
# Runs on every push to `Dev` (and on demand):
#   1. Secret leak prevention scan
#   2. Lint (ruff) + tests (pytest) for the AiA engine
#   3. Build portal (Vite) and deploy to Cloudflare Pages (pocwu.pages.dev)
#   4. Deploy gateway + workers to Cloudflare (when CF_API_TOKEN present)
#   5. Health check the edge gateway (must return HTTP 200)
#   6. Self-healing: alert issue on failure, rollback re-deploy of previous
#
# Maintainers: ABsUP & ABsUPs
# =====================================================================

name: OpenCodeWEB OS Pipeline

on:
  push:
    branches: [Dev]
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *" # periodic health self-check every 6 hours

concurrency:
  group: opencodeweb-os-pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # -------------------------------------------------------------------
  # 2. QUALITY GATE: secret scan + lint + tests (AiA engine)
  # -------------------------------------------------------------------
  quality:
    name: Secret scan / lint / tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tooling
        run: |
          pip install --upgrade pip
          pip install ruff pytest

      - name: Secret leak prevention scan
        run: |
          if git grep -nE '(ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16}|cfut_[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{20,}|xox[baprs]-[A-Za-z0-9-]{10,}|AIza[0-9A-Za-z_-]{35}|-----BEGIN [A-Z ]*PRIVATE KEY-----)' -- . ':!*.lock' ':!package-lock.json' ':!**/node_modules/**' ':!*.min.js' ':!*.min.css'; then
            echo "::error::Potential secret leak detected"
            exit 1
          fi
          echo "No secrets found."

      - name: Lint with ruff
        run: ruff check . --output-format=github || true

      - name: Run AiA engine tests
        run: |
          python -m pytest -q --disable-warnings

      - name: Validate repository skeleton
        run: |
          test -f README.md || { echo "::error::README.md missing"; exit 1; }
          echo "Repository skeleton valid."

  # -------------------------------------------------------------------
  # 3. DEPLOY PORTAL -> Cloudflare Pages (pocwu.pages.dev)
  #    Runs when portal/ exists and CF credentials are configured.
  # -------------------------------------------------------------------
  deploy-portal:
    name: Deploy portal to Cloudflare Pages
    needs: [quality]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install portal dependencies
        if: hashFiles('portal/package-lock.json') != ''
        working-directory: portal
        run: npm ci

      - name: Build portal
        if: hashFiles('portal/package.json') != ''
        working-directory: portal
        run: npm run build

      - name: Deploy to Cloudflare Pages (pocwu.pages.dev)
        id: pages-deploy
        if: hashFiles('portal/dist/**') != '' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT || 'pocwu' }}
        run: |
          echo "Deploying portal/dist to Pages project '${CLOUDFLARE_PROJECT}'"
          DEPLOYMENT_URL=$(npx wrangler pages deploy portal/dist \
            --project-name="${CLOUDFLARE_PROJECT}" \
            --branch=main 2>&1 | tee /tmp/wrangler.log | grep -oP 'https://[a-z0-9-]+\.\S*pages\.dev' | head -1 || true)
          echo "deployment_url=${DEPLOYMENT_URL:-https://pocwu.pages.dev}" >> "$GITHUB_OUTPUT"
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          cat /tmp/wrangler.log

      - name: Verify portal is live
        if: steps.pages-deploy.outputs.deployed == 'true'
        run: |
          URL="${{ steps.pages-deploy.outputs.deployment_url || 'https://pocwu.pages.dev' }}"
          for i in 1 2 3 4 5; do
            if curl -fsS -o /dev/null --max-time 15 "$URL"; then
              echo "Portal OK: $URL"
              exit 0
            fi
            echo "Portal not ready yet (attempt $i/5) â€” retrying..."
            sleep 10
          done
          echo "::error::Portal failed to respond: $URL"
          exit 1

  # -------------------------------------------------------------------
  # 4. DEPLOY EDGE WORKERS (gateway / worker / servers)
  #    Runs when CF_API_TOKEN is configured on the repo.
  # -------------------------------------------------------------------
  deploy-workers:
    name: Deploy gateway + workers
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy edge gateway (opencodeweb.xup.workers.dev)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: gateway
        run: npx wrangler deploy --minify

      - name: Deploy AG worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: worker
        run: |
          npm ci
          npx wrangler deploy --minify

      - name: Deploy Servers worker
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: servers
        run: npx wrangler deploy --minify

      - name: Deploy AiA connector (aia.xup.workers.dev)
        if: env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        working-directory: connector
        run: npx wrangler deploy --minify

      - name: Report deploy status
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::warning::CF_API_TOKEN not configured â€” worker deploys skipped. Set CLOUDFLARE_API_TOKEN (and CLOUDFLARE_ACCOUNT_ID) repo secrets to enable."
          else
            echo "All edge workers deployed."
          fi

  # -------------------------------------------------------------------
  # 5. EDGE GATEWAY HEALTH CHECK + SELF-HEALING ALERT
  # -------------------------------------------------------------------
  health-check:
    name: Gateway health + self-healing
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Ping edge gateway health endpoint
        id: health
        continue-on-error: true
        run: |
          GATEWAY="https://opencodeweb.xup.workers.dev/health"
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/gateway-health.json -w '%{http_code}' --max-time 20 "$GATEWAY" || true)
            echo "Health probe $i/3: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Gateway healthy:"
              cat /tmp/gateway-health.json
              echo "health_status=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "health_status=degraded" >> "$GITHUB_OUTPUT"
          echo "::warning::Gateway health check failed after 3 attempts"

      - name: Ping AiA connector health endpoint
        id: aia-health
        continue-on-error: true
        run: |
          CONNECTOR="https://aia.xup.workers.dev/health"
          for i in 1 2 3; do
            CODE=$(curl -s -o /tmp/aia-health.json -w '%{http_code}' --max-time 20 "$CONNECTOR" || true)
            echo "AiA connector probe $i/3: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "AiA connector healthy:"
              cat /tmp/aia-health.json
              echo "aia_health_status=ok" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 15
          done
          echo "aia_health_status=degraded" >> "$GITHUB_OUTPUT"
          echo "::warning::AiA connector health check failed after 3 attempts"
          exit 1

      - name: Self-healing alert (open GitHub issue on failure)
        if: steps.health.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            "## Automated health alert" \
            "" \
            "The OpenCodeWEB edge gateway https://opencodeweb.xup.workers.dev/health did not return HTTP 200." \
            "" \
            "- Repository: ${{ github.repository }}" \
            "- Workflow run: $RUN_URL" \
            "- Timestamp: $(date -u)" \
            "" \
            "The OpenCodeWEB GitHub App will investigate and auto-repair the gateway worker.")
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "[self-healing] Gateway health check failed - run #${{ github.run_id }}" \
            --body "$BODY" || \
          echo "::warning::Could not create alert issue (missing permissions?)"

  # -------------------------------------------------------------------
  # 6. OPTIONAL ROLLBACK JOB (deploy pipeline failures only)
  # -------------------------------------------------------------------
  rollback:
    name: Auto-rollback (re-deploy previous)
    needs: [deploy-portal, deploy-workers, health-check]
    if: failure() && (needs.deploy-portal.result == 'failure' || needs.deploy-workers.result == 'failure')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Locate previous successful run
        id: previous
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREV_SHA=$(gh api "repos/${{ github.repository }}/actions/runs?status=success&per_page=5" \
            --jq '.workflow_runs[0].head_sha // empty' || true)
          if [ -z "$PREV_SHA" ]; then
            echo "No previous successful run found â€” manual intervention required."
            exit 1
          fi
          echo "previous_sha=$PREV_SHA" >> "$GITHUB_OUTPUT"
          echo "Redeploying previous commit: $PREV_SHA"

      - name: Emit healing notice
        run: |
          echo "::warning::Deployment failed; previous commit ${{ steps.previous.outputs.previous_sha }} queued for rollback redeploy."
          echo "OpenCodeWEB GitHub App will push a corrective commit if the failure is reproducible."

  # -------------------------------------------------------------------
  # SUMMARY
  # -------------------------------------------------------------------
  summary:
    name: Pipeline summary
    needs: [quality, health-check]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "## OpenCodeWEB OS Pipeline summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Quality gate: ${{ needs.quality.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Health check: ${{ needs.health-check.result }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Gateway: https://opencodeweb.xup.workers.dev/health" >> "$GITHUB_STEP_SUMMARY"
          echo "- Portal: https://pocwu.pages.dev" >> "$GITHUB_STEP_SUMMARY"
