# apache.conf — Apache HTTPD config for OpenCodeABs/UX
#
# Converted from TypeScript security patterns in functions/_middleware.ts

<VirtualHost *:443>
    ServerName pocwu.pages.dev

    DocumentRoot /var/www/pocwu

    # Security headers (converted from TypeScript _middleware.ts)
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set X-XSS-Protection "1; mode=block"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "camera=(), microphone=()"
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.mongodb.net https://api.github.com https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: blob: https://avatars.githubusercontent.com; font-src 'self' https://fonts.gstatic.com;"

    # CORS headers
    Header always set Access-Control-Allow-Origin "https://pocwu.pages.dev"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization, X-Device-Hash"

    # SPA fallback
    <Directory /var/www/pocwu>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        FallbackResource /index.html
    </Directory>

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType text/html "access plus 0 seconds"
        ExpiresByType image/png "access plus 1 year"
        ExpiresByType image/svg+xml "access plus 1 year"
        ExpiresByType application/javascript "access plus 1 year"
        ExpiresByType text/css "access plus 1 year"
    </IfModule>

    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css application/json application/javascript
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/pocwu-error.log
    CustomLog ${APACHE_LOG_DIR}/pocwu-access.log combined
</VirtualHost>
