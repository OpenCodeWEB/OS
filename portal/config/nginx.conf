# nginx.conf — Nginx reverse proxy for OpenCodeABs/UX
#
# Converted from TypeScript middleware/security patterns in functions/_middleware.ts
# Provides caching, compression, CORS, and security headers.

server {
    listen 80;
    server_name pocwu.pages.dev;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pocwu.pages.dev;

    # SSL (configure with certbot or your CA)
    ssl_certificate     /etc/ssl/certs/pocwu.pem;
    ssl_certificate_key /etc/ssl/private/pocwu.key;

    # Security headers (converted from TypeScript _middleware.ts)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; connect-src 'self' https://*.mongodb.net https://api.github.com https://cloudflareinsights.com https://*.cloudflareinsights.com; img-src 'self' data: blob: https://avatars.githubusercontent.com; font-src 'self' https://fonts.gstatic.com;" always;

    # CORS (converted from TypeScript corsHeaders)
    add_header Access-Control-Allow-Origin "https://pocwu.pages.dev" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Device-Hash" always;

    # Static assets
    location /assets/ {
        root /var/www/pocwu;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        root /var/www/pocwu;
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache";
    }

    # API proxy to Cloudflare Pages Functions
    location /api/ {
        proxy_pass https://pocwu.pages.dev;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 256;
}
