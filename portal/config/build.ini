; build.ini — Build configuration for OpenCodeABs/UX
; Converted from TypeScript config values in MultiplayerGlobe.tsx and cities.json

[globe]
auto_rotate_speed = 0.005
drag_sensitivity = 0.004
friction = 0.5
velocity_threshold = 0.005
resolution_scale = 2
max_globe_size = 540
min_globe_size = 280
theta = 0.35

[colors]
base = 0.05, 0.08, 0.20
marker = 0.10, 0.60, 1.00
glow = 0.00, 0.40, 0.80
arc = 0.30, 0.80, 1.00
self = 0.30, 1.00, 1.00
peer_arc = 0.30, 0.80, 1.00

[deploy]
project = pocwu
branch = main
production_url = https://pocwu.pages.dev
