# docker-compose.yml — Multi-service deployment for OpenCodeABs/UX
#
# Services:
#   app    — Production build via serve (Dockerfile)
#   relay  — DO WebSocket relay (standalone Worker, for local testing)
#
# Usage:
#   docker compose up -d          # start all services
#   docker compose down           # stop all services
---

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  relay:
    build:
      context: ./do-worker
      dockerfile: Dockerfile
    ports:
      - "8788:8788"
    environment:
      - NODE_ENV=development
    restart: unless-stopped
